databases:
  - name: scholastic-db
    databaseName: scholastic
    plan: free

services:
  - type: web
    name: scholastic-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: ./start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scholastic-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://scholastic-web.onrender.com
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: scholastic-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: CI
        value: "false"
      - key: REACT_APP_API_URL
        value: https://scholastic-api.onrender.com
      - key: REACT_APP_ENABLE_DEMO
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html